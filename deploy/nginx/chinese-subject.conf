# chinese subject portal using the shared English account backend.
server {
    listen 80;
    listen [::]:80;
    server_name chinese.itorange.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chinese.itorange.online;

    ssl_certificate /etc/letsencrypt/live/chinese.itorange.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chinese.itorange.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/chinese-subject.access.log english_perf;
    error_log /var/log/nginx/chinese-subject.error.log;
    client_max_body_size 16m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    # Content hashes make these assets safe to cache across deployments.
    location ^~ /static/assets/ {
        root /data/english_reciter;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # Other static paths retain a short cache so later content additions refresh.
    location /static/ {
        root /data/english_reciter;
        try_files $uri =404;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location / {
        include /etc/nginx/snippets/icp-footer.inc;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
