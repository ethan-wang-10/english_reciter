server {
    listen 80;
    listen [::]:80;
    server_name english.itorange.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name english.itorange.online;

    ssl_certificate     /etc/letsencrypt/live/english.itorange.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/english.itorange.online/privkey.pem;

    access_log /var/log/nginx/english-reciter.access.log english_perf;
    error_log  /var/log/nginx/english-reciter.error.log;
    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/plain;

    location ^~ /static/ {
        root /data/english_reciter;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
