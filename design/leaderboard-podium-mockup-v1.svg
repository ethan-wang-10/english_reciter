<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1480" height="680" viewBox="0 0 1480 680">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fff7e4"/>
    </linearGradient>
    <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faded">
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#6d5037" flood-opacity="0.2"/>
    </filter>
    <clipPath id="avatarEthan"><circle cx="740" cy="248" r="57"/></clipPath>
    <clipPath id="avatarDylan"><circle cx="476" cy="297" r="48"/></clipPath>
    <clipPath id="avatarWang"><circle cx="1004" cy="317" r="48"/></clipPath>
    <clipPath id="fan1"><circle cx="250" cy="611" r="28"/></clipPath>
