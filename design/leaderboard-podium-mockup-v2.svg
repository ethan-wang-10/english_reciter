<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1480" height="680" viewBox="0 0 1480 680">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fff7e4"/>
    </linearGradient>
    <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faded">
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#6d5037" flood-opacity="0.2"/>
    </filter>
    <clipPath id="avatarEthan"><circle cx="740" cy="342" r="57"/></clipPath>
    <clipPath id="avatarDylan"><circle cx="476" cy="382" r="48"/></clipPath>
    <clipPath id="avatarWang"><circle cx="1004" cy="402" r="48"/></clipPath>
    <symbol id="cheeringFan" viewBox="0 0 80 104">
      <path d="M23 58L10 20M57 58L70 20" fill="none" stroke="#684a36" stroke-width="12" stroke-linecap="round"/>
      <path d="M23 58L10 20M57 58L70 20" fill="none" stroke="#f2b995" stroke-width="7" stroke-linecap="round"/>
      <circle cx="9" cy="17" r="7" fill="#f2b995" stroke="#684a36" stroke-width="3"/>
      <circle cx="71" cy="17" r="7" fill="#f2b995" stroke="#684a36" stroke-width="3"/>
      <path d="M17 61Q40 45 63 61L69 105H11Z" fill="currentColor" stroke="#684a36" stroke-width="4"/>
      <path d="M29 57Q40 70 51 57" fill="#fff9e8" stroke="#684a36" stroke-width="3" stroke-linejoin="round"/>
      <path d="M20 82H60" stroke="#fff" stroke-opacity="0.5" stroke-width="7"/>
    </symbol>
  </defs>

  <rect x="2" y="2" width="1476" height="676" rx="8" fill="url(#paper)" stroke="#d7c8b2" stroke-width="4" filter="url(#paperNoise)"/>
  <path d="M3 80H1477" stroke="#e7dccb" stroke-width="2"/>

  <text x="32" y="48" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="900" fill="#40372f">上期月榜三甲</text>
  <text x="224" y="48" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="650" fill="#8a7968">2026年7月1日 - 31日</text>
  <rect x="1326" y="22" width="122" height="37" rx="6" fill="#ebffd4" stroke="#b6d987" stroke-width="2"/>
  <text x="1387" y="47" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="850" fill="#397300">奖励已结算</text>

  <g stroke="#684a36" stroke-width="3" stroke-linejoin="round">
    <path d="M573 108l50-8 7 18-48 13z" fill="#f0795f"/>
    <path d="M907 108l-50-8-7 18 48 13z" fill="#66bba3"/>
  </g>
  <text x="740" y="126" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="950" fill="#68452f">恭喜获奖</text>

  <g stroke="#684a36" stroke-width="2.5">
    <path d="M150 135l12 25-14 7-12-25z" fill="#f4c743"/>
    <path d="M265 188l23-8 6 14-23 8z" fill="#67acd1"/>
    <path d="M1330 138l-12 25 14 7 12-25z" fill="#e97d70"/>
