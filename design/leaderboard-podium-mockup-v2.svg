    <path d="M187 260l9 19 21 3-16 14 5 21-19-11-19 11 5-21-16-14 21-3z" fill="#f4c743"/>
    <path d="M1293 260l-9 19-21 3 16 14-5 21 19-11 19 11-5-21 16-14-21-3z" fill="#f4c743"/>
  </g>

  <!-- The winners stay avatar-only so real profile images remain the focus. -->
  <g filter="url(#softShadow)">
    <circle cx="476" cy="382" r="51" fill="#e9eef1" stroke="#c5d0d8" stroke-width="6"/>
    <image x="428" y="334" width="96" height="96" xlink:href="leaderboard-avatar-dylan.png" clip-path="url(#avatarDylan)" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <text x="476" y="451" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="900" fill="#443930">dylan4213</text>
  <text x="476" y="474" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="750" fill="#887665">7,239 XP</text>
  <rect x="340" y="489" width="272" height="104" rx="10" fill="#9bc3da" stroke="#684a36" stroke-width="4"/>
  <path d="M347 501H605" stroke="#fff" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"/>
  <text x="476" y="531" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="950" fill="#3f4d55">第 2 名</text>
  <rect x="429" y="545" width="94" height="32" rx="6" fill="#fff" fill-opacity="0.76"/>
  <text x="476" y="567" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="900" fill="#3f4d55">+330 XP</text>

  <!-- First place -->
  <g filter="url(#softShadow)">
    <circle cx="740" cy="342" r="61" fill="#f5ce3d" stroke="#d99f00" stroke-width="7"/>
    <image x="683" y="285" width="114" height="114" xlink:href="leaderboard-avatar-ethan.png" clip-path="url(#avatarEthan)" preserveAspectRatio="xMidYMid slice"/>
    <path d="M704 274l9-31 24 21 18-33 15 36 28-17-5 35z" fill="#f5c63f" stroke="#684a36" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="713" cy="244" r="5" fill="#f0755d"/><circle cx="755" cy="232" r="5" fill="#69bca3"/><circle cx="798" cy="251" r="5" fill="#f0755d"/>
  </g>
  <text x="740" y="421" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="950" fill="#443930">ethan</text>
  <text x="740" y="445" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="750" fill="#887665">9,738 XP</text>
  <rect x="597" y="479" width="286" height="114" rx="10" fill="#f5c83e" stroke="#684a36" stroke-width="4"/>
  <path d="M604 491H876" stroke="#fff" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"/>
  <text x="740" y="524" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="950" fill="#5e4700">第 1 名</text>
  <rect x="691" y="540" width="98" height="34" rx="6" fill="#fff" fill-opacity="0.78"/>
  <text x="740" y="563" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="900" fill="#5e4700">+540 XP</text>

  <!-- Third place -->
  <g filter="url(#softShadow)">
    <circle cx="1004" cy="402" r="51" fill="#f3ddd0" stroke="#d77a40" stroke-width="6"/>
    <image x="956" y="354" width="96" height="96" xlink:href="leaderboard-avatar-wanggang.png" clip-path="url(#avatarWang)" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <text x="1004" y="467" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="900" fill="#443930">wanggang</text>
  <text x="1004" y="490" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="750" fill="#887665">3,873 XP</text>
  <rect x="868" y="505" width="272" height="88" rx="10" fill="#e78a51" stroke="#684a36" stroke-width="4"/>
  <path d="M875 517H1133" stroke="#fff" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round"/>
  <text x="1004" y="546" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="950" fill="#65391f">第 3 名</text>
  <rect x="957" y="557" width="94" height="29" rx="6" fill="#fff" fill-opacity="0.74"/>
  <text x="1004" y="577" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="900" fill="#65391f">+220 XP</text>

  <!-- Two audience rows add density without competing with the podium data. -->
  <rect x="2" y="585" width="1476" height="93" fill="#fff0c9" fill-opacity="0.94"/>
  <path d="M2 585H1478" stroke="#dabb8e" stroke-width="3"/>
  <g opacity="0.92">
    <use x="80" y="555" width="80" height="125" color="#e86c57" xlink:href="#cheeringFan"/>
    <use x="260" y="555" width="80" height="125" color="#61b28b" xlink:href="#cheeringFan"/>
    <use x="440" y="555" width="80" height="125" color="#e89b43" xlink:href="#cheeringFan"/>
    <use x="960" y="555" width="80" height="125" color="#62a8d2" xlink:href="#cheeringFan"/>
    <use x="1140" y="555" width="80" height="125" color="#ef765c" xlink:href="#cheeringFan"/>
    <use x="1320" y="555" width="80" height="125" color="#75b95d" xlink:href="#cheeringFan"/>
  </g>
  <g>
    <use x="0" y="596" width="80" height="112" color="#72b65e" xlink:href="#cheeringFan"/>
    <use x="180" y="596" width="80" height="112" color="#e98555" xlink:href="#cheeringFan"/>
    <use x="360" y="596" width="80" height="112" color="#5f9fd0" xlink:href="#cheeringFan"/>
