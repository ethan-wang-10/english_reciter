    <text x="1360" y="629" font-size="24" fill="#9b5a22">K</text>

    <circle cx="40" cy="646" r="31" fill="#e8f4d7" stroke="#fff" stroke-width="6"/>
    <text x="40" y="656" font-size="26" fill="#527c28">J</text>
    <circle cx="220" cy="646" r="31" fill="#fff" stroke="#fff" stroke-width="6"/>
    <circle cx="400" cy="646" r="31" fill="#ffe0dc" stroke="#fff" stroke-width="6"/>
