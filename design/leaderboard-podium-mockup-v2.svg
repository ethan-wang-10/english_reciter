  <g filter="url(#softShadow)" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="900" text-anchor="middle">
    <circle cx="120" cy="620" r="28" fill="#fff" stroke="#fff" stroke-width="6"/>
    <circle cx="300" cy="620" r="28" fill="#d9f0e5" stroke="#fff" stroke-width="6"/>
    <text x="300" y="629" font-size="24" fill="#36745b">L</text>
    <circle cx="480" cy="620" r="28" fill="#fff" stroke="#fff" stroke-width="6"/>
    <circle cx="1000" cy="620" r="28" fill="#dceafa" stroke="#fff" stroke-width="6"/>
    <text x="1000" y="629" font-size="24" fill="#326c9a">M</text>
    <circle cx="1180" cy="620" r="28" fill="#fff" stroke="#fff" stroke-width="6"/>
