    <circle cx="1080" cy="646" r="31" fill="#fff" stroke="#fff" stroke-width="6"/>
    <circle cx="1260" cy="646" r="31" fill="#e1f1eb" stroke="#fff" stroke-width="6"/>
    <text x="1260" y="656" font-size="26" fill="#34745d">C</text>
    <circle cx="1440" cy="646" r="31" fill="#fff" stroke="#fff" stroke-width="6"/>
  </g>
  <text x="1452" y="575" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#9a816b">视觉示意 V2</text>
</svg>
