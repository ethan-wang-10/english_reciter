version: '3.8'

services:
  web:
    build: .
    container_name: english-reciter
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # 持久化用户数据
      - ./user_data_simple:/app/user_data_simple
      # 开发时可以挂载代码
      # - ./reciter.py:/app/reciter.py
      # - ./simple_web_app.py:/app/simple_web_app.py
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a strong random value, e.g. openssl rand -hex 32}
      - FLASK_ENV=production
      - TZ=${TZ:-Asia/Shanghai}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-智能英语背诵}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-}
      - SMTP_TIMEOUT=${SMTP_TIMEOUT:-15}
      - PASSWORD_RESET_TTL_MINUTES=${PASSWORD_RESET_TTL_MINUTES:-30}
      - PASSWORD_RESET_COOLDOWN_SECONDS=${PASSWORD_RESET_COOLDOWN_SECONDS:-60}
      - OCR_ONNX_THREADS=${OCR_ONNX_THREADS:-2}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
