<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>正在切换学科 · 学科学习</title>
    <style>
        :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; color: #213e3b; background: #f4f8f5; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; }
        main { max-width: 420px; width: 100%; padding: 36px; border: 1px solid #dce8df; border-radius: 24px; background: white; box-shadow: 0 14px 50px #2247310a; }
        .mark { color: #2b7451; font-size: 13px; font-weight: 750; letter-spacing: .12em; }
        h1 { font-size: 24px; margin: 18px 0 12px; }
        p { line-height: 1.8; font-size: 15px; color: #62706b; margin: 0 0 24px; }
        a { display: inline-block; border-radius: 12px; color: white; background: #286a4c; padding: 12px 18px; text-decoration: none; font-weight: 650; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <span class="mark">学科学习</span>
        <h1 id="sso-title">正在切换学科</h1>
        <p id="sso-status" role="status" aria-live="polite">正在确认你的登录状态，请稍候。</p>
        <a id="sso-return" href="/" hidden>返回学科首页</a>
    </main>
    <script id="subject-sso-config" type="application/json">{{ sso_config|tojson }}</script>
    <script src="{{ sso_script_url }}" defer></script>
</body>
</html>
